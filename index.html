<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0e0d0c">
    <script>
      (function () {
        var theme = "dark";
        try {
          var data = JSON.parse(localStorage.getItem("poicalc.setup") || "");
          if (data && data.theme === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#e6e2da" : "#0e0d0c");
        var standalone = window.navigator.standalone === true
          || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
        if (standalone) document.documentElement.classList.add("standalone");
      })();
      (function () {
        var blockGesture = function (event) { event.preventDefault(); };
        document.addEventListener("gesturestart", blockGesture, { passive: false });
        document.addEventListener("gesturechange", blockGesture, { passive: false });
        document.addEventListener("gestureend", blockGesture, { passive: false });
        var blockPinch = function (event) {
          if (event.touches && event.touches.length > 1) event.preventDefault();
        };
        document.addEventListener("touchstart", blockPinch, { passive: false });
        document.addEventListener("touchmove", blockPinch, { passive: false });
        document.addEventListener("selectstart", function (event) {
          var node = event.target;
          if (node && node.closest && node.closest("input, textarea, select")) return;
          event.preventDefault();
        });
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="POI">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="Point of impact for one zeroed rifle or pistol.">
    <title>POI</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-180.png" sizes="180x180">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app">
      <div class="mast">
        <h1>POI Calc</h1>
        <span id="version"></span>
      </div>
      <header class="top">
        <div class="top-units">
          <div class="units" role="radiogroup" aria-label="Units">
            <button type="button" id="unit-imperial" role="radio" aria-checked="true">Imperial</button>
            <button type="button" id="unit-metric" role="radio" aria-checked="false">Metric</button>
          </div>
          <p id="unit-hint" class="hint"></p>
        </div>
        <div class="units theme-toggle" role="radiogroup" aria-label="Appearance">
          <button type="button" id="theme-dark" role="radio" aria-checked="true" aria-label="Dark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 2.5a8.5 8.5 0 1 0 6 14.2A8.8 8.8 0 0 1 15.5 2.5z"/></svg>
          </button>
          <button type="button" id="theme-light" role="radio" aria-checked="false" aria-label="Light">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1V21.5M2.5 12h2.4M19.1 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M19.2 4.8l-1.7 1.7M6.5 17.5l-1.7 1.7"/></g></svg>
          </button>
        </div>
      </header>

      <section class="panel" id="setup-section" aria-labelledby="setup-heading">
        <h2 id="setup-heading">Barrel and optic</h2>
        <div class="specs">
          <label class="spec">
            <span class="spec-value">
              <input id="barrel" inputmode="decimal" autocomplete="off" aria-label="Barrel length">
              <span id="barrel-unit"></span>
            </span>
            <button type="button" class="spec-name tip-title" data-tip="Barrel length. Catalog speed shifts 25 feet per second for each inch longer or shorter than that load's reference barrel." aria-expanded="false">Barrel</button>
          </label>
          <label class="spec">
            <span class="spec-value">
              <input id="sight" inputmode="decimal" autocomplete="off" aria-label="Optic height over bore">
              <span id="sight-unit"></span>
            </span>
            <button type="button" class="spec-name tip-title" data-tip="How high the sight sits above the center of the bore. The bullet has to climb that height to meet the line of sight at the zero. Typical heights, not exact: AR absolute cowitness about 1.5 inches, lower 1/3 about 1.9 inches, a pistol red dot about 0.8 inches, an AK side-rail optic about 2.5 inches." aria-expanded="false">Optic height over bore</button>
          </label>
        </div>
      </section>

      <section class="panel" id="distance-panel" aria-label="Desired zero, zero target distance, close target distance, and far target distance">
        <div class="play">
          <div class="play-control" data-mark="zero">
            <div class="play-line">
              <h2><button type="button" class="tip-title" data-tip="Distance you want the bullet to cross the line of sight." aria-expanded="false">Desired Zero</button></h2>
              <div class="stepper">
                <button type="button" id="zero-dec" aria-label="Shorter desired zero">−</button>
                <label class="dist-readout">
                  <input id="zero" inputmode="decimal" autocomplete="off" aria-label="Desired Zero">
                  <span id="zero-unit"></span>
                </label>
                <button type="button" id="zero-inc" aria-label="Longer desired zero">+</button>
              </div>
            </div>
            <input id="zero-slider" class="slider" type="range" aria-label="Desired Zero slider">
          </div>
          <div class="play-control" data-mark="paper">
            <div class="play-line">
              <h2><button type="button" class="tip-title" data-tip="Distance to the paper target you are using to zero." aria-expanded="false">Zero Target Distance</button></h2>
            </div>
            <div class="play-line">
              <p class="paper-hit">
                <span class="paper-hit-label">Hit paper</span>
                <span id="paper-offset"></span>
              </p>
              <div class="stepper">
                <button type="button" id="paper-dec" aria-label="Shorter zero target distance">−</button>
                <label class="dist-readout">
                  <input id="paper" inputmode="decimal" autocomplete="off" aria-label="Zero Target Distance">
                  <span id="paper-unit"></span>
                </label>
                <button type="button" id="paper-inc" aria-label="Longer zero target distance">+</button>
              </div>
            </div>
            <input id="paper-slider" class="slider" type="range" aria-label="Zero Target Distance slider">
          </div>
          <div class="play-control" data-mark="close">
            <div class="play-line">
              <h2><button type="button" class="tip-title" data-tip="The nearer shot you want to see. It stays shorter than Far target distance. The coral mark is this distance." aria-expanded="false">Close target distance</button></h2>
              <div class="stepper">
                <button type="button" id="close-dec" aria-label="Shorter close target distance">−</button>
                <label class="dist-readout">
                  <input id="close" inputmode="decimal" autocomplete="off" aria-label="Close target distance">
                  <span id="close-unit"></span>
                </label>
                <button type="button" id="close-inc" aria-label="Longer close target distance">+</button>
              </div>
            </div>
            <input id="close-slider" class="slider" type="range" aria-label="Close target distance slider">
          </div>
          <div class="play-control" data-mark="far">
            <div class="play-line">
              <h2><button type="button" class="tip-title" data-tip="The farther shot you want to see. It stays longer than Close target distance. The blue mark is this distance." aria-expanded="false">Far target distance</button></h2>
              <div class="stepper">
                <button type="button" id="far-dec" aria-label="Shorter far target distance">−</button>
                <label class="dist-readout">
                  <input id="far" inputmode="decimal" autocomplete="off" aria-label="Far target distance">
                  <span id="far-unit"></span>
                </label>
                <button type="button" id="far-inc" aria-label="Longer far target distance">+</button>
              </div>
            </div>
            <input id="far-slider" class="slider" type="range" aria-label="Far target distance slider">
          </div>
        </div>
      </section>

      <section class="stage" id="stage" aria-label="Point of impact">
        <div class="target-wrap">
          <svg id="target" viewBox="0 0 208 208" role="img"></svg>
        </div>
        <p id="target-caption" class="caption"></p>
        <div class="chart-head">
          <span class="chart-extents">
            <span id="chart-min"></span>
            <span id="chart-max"></span>
            <span id="chart-spread"></span>
          </span>
          <span class="chart-impacts">
            <span id="chart-close"></span>
            <span id="chart-far"></span>
          </span>
        </div>
        <div class="chart-frame">
          <svg id="path" viewBox="0 0 356 156" role="img"></svg>
        </div>
        <div class="plot-scale">
          <h2>Plot to</h2>
          <div class="units" role="radiogroup" aria-label="Plot distance">
            <button type="button" id="plot-auto" role="radio" aria-checked="true">Auto</button>
            <button type="button" id="plot-custom" role="radio" aria-checked="false">Custom</button>
          </div>
          <label class="plot-max" id="plot-max-field" hidden>
            <input id="plot-max" inputmode="decimal" autocomplete="off" aria-label="Maximum plot distance">
            <span id="plot-unit"></span>
          </label>
        </div>
      </section>

      <section class="panel" id="ammo-section" aria-labelledby="ammo-heading">
        <div class="panel-head">
          <h2 id="ammo-heading">Ammunition</h2>
          <button type="button" id="add-ammo">Add a load</button>
        </div>

        <div id="edit-fields" class="load-fields">
          <div class="fields">
            <label class="field" id="brand-name-field" hidden>
              <button type="button" class="tip-title" data-tip="The maker on the box. Leave it blank if you do not want a name." aria-expanded="false">Brand name</button>
              <input id="custom-brand" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Brand name">
            </label>
            <label class="field" id="model-field" hidden>
              <button type="button" class="tip-title" data-tip="The model number on the box. Leave it blank if the box has none." aria-expanded="false">Model</button>
              <input id="model" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Model">
            </label>
            <label class="field" id="upc-field" hidden>
              <button type="button" class="tip-title" data-tip="The UPC printed on the box, if it has one. Leave it blank when there is no UPC." aria-expanded="false">UPC</button>
              <input id="upc" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="UPC">
            </label>
          </div>
          <div class="use-line">
            <label class="field">
              <button type="button" class="tip-title" id="weight-label" data-tip="Bullet weight from the box. The path uses muzzle speed and G1 BC. Weight keeps each load recognizable." aria-expanded="false">Weight</button>
              <input id="weight" inputmode="decimal" autocomplete="off">
            </label>
            <label class="field">
              <button type="button" class="tip-title" id="speed-label" data-tip="How fast the bullet leaves the muzzle. A typed speed replaces the catalog speed. Otherwise it shifts 25 feet per second for each inch of barrel." aria-expanded="false">Muzzle speed</button>
              <input id="speed" inputmode="decimal" autocomplete="off">
            </label>
            <label class="field">
              <button type="button" class="tip-title" data-tip="How well the bullet holds its speed, on the G1 model. A higher number drops less. If the maker published no G1, type one to draw the path." aria-expanded="false">G1 BC</button>
              <input id="bc" inputmode="decimal" autocomplete="off">
            </label>
          </div>
        </div>

        <div id="ammo-groups"></div>

        <div id="add-panel" class="load-fields">
          <p class="add-title">Custom load</p>
          <div class="fields">
            <label class="field">
              <button type="button" class="tip-title" data-tip="The maker on the box. Leave it blank if you do not want a name." aria-expanded="false">Brand name</button>
              <input id="add-brand" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Custom brand name">
            </label>
            <label class="field">
              <button type="button" class="tip-title" data-tip="The model number on the box. Leave it blank if the box has none." aria-expanded="false">Model</button>
              <input id="add-model" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Custom model">
            </label>
            <label class="field">
              <button type="button" class="tip-title" data-tip="The UPC printed on the box, if it has one. Leave it blank when there is no UPC." aria-expanded="false">UPC</button>
              <input id="add-upc" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Custom UPC">
            </label>
            <label class="field">
              <button type="button" class="tip-title" data-tip="The cartridge name, such as .223 Rem or 9mm. Loads with the same name sit in one group." aria-expanded="false">Caliber</button>
              <input id="add-caliber" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="New caliber">
            </label>
            <label class="field">
              <button type="button" class="tip-title" id="add-weight-label" data-tip="Bullet weight from the box. The path uses muzzle speed and G1 BC. Weight keeps each load recognizable." aria-expanded="false">Weight</button>
              <input id="add-weight" inputmode="decimal" autocomplete="off" aria-label="New weight">
            </label>
            <label class="field">
              <button type="button" class="tip-title" id="add-speed-label" data-tip="How fast the bullet leaves the muzzle. A typed speed replaces the catalog speed. Otherwise it shifts 25 feet per second for each inch of barrel." aria-expanded="false">Muzzle speed</button>
              <input id="add-speed" inputmode="decimal" autocomplete="off" aria-label="New muzzle speed">
            </label>
            <label class="field">
              <button type="button" class="tip-title" data-tip="How well the bullet holds its speed, on the G1 model. A higher number drops less. If the maker published no G1, type one to draw the path." aria-expanded="false">G1 BC</button>
              <input id="add-bc" inputmode="decimal" autocomplete="off" aria-label="New G1 ballistic coefficient">
            </label>
          </div>
          <p class="add-hint">Type a caliber, grain weight, and muzzle speed. Brand name, model, UPC, and G1 BC stay empty unless you type them.</p>
          <div class="add-actions">
            <button type="button" id="add-cancel">Cancel</button>
            <button type="button" id="add-save" disabled>Save ammo</button>
          </div>
        </div>

        <p id="rule" class="rule"></p>
        <button type="button" id="use-catalog" hidden>Use catalog speed</button>
      </section>

    </div>
    <noscript>POI needs JavaScript to calculate the path.</noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
